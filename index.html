function nearest(la,lo){if(!(la>35&&la<48&&lo>6&&lo<19))return null;let b=null,bd=.64;for(const p of PROV){const dy=p.la-la,dx=(p.lo-lo)*Math.cos(la*Math.PI/180),d=dy*dy+dx*dx;if(d<bd){bd=d;b=p}}return b}
function toRadio(m,url,i,country,pre){const it=country==="Italia",hay=norm(m.group+" "+m.name);let region,city;
  if(it)for(const r of REGIONS){const x=hay.match(GEO_RE[r]);if(x){region=r;if(x[2]!==norm(r)&&!NOCITY.test(x[2]))city=x[2].replace(/(^|\s)\S/g,c=>c.toUpperCase());break}}
  const gp=it&&m.lat&&m.lon?nearest(+m.lat,+m.lon):null;if(gp){city=gp.city;region=gp.region}
  const g=[...new Set(GK.filter(([k])=>hay.includes(k)).map(([,v])=>v))];
  return{id:pre+slug(m.name)+"-"+i,name:m.name,logo:m.logo,streamUrl:url,region:it?(region||"Italia"):country,city,genre:g.length?g:["Varie"],isNational:it?!region:true,country,language:m.lang||LANG[country]||"Altro"}}
function parseM3U(t,country="Italia",pre=""){const out=[],seen=new Set();let m=null;
  for(const raw of t.split(/\r?\n/)){const l=raw.trim();
    if(l.startsWith("#EXTINF")){const a=k=>(l.match(new RegExp(k+'="([^"]*)"','i'))||[])[1]||"";m={logo:a("tvg-logo"),group:a("group-title"),lang:a("tvg-language"),name:l.slice(l.lastIndexOf(",")+1).trim()||a("tvg-name")}}
    else if(l&&!l.startsWith("#")&&m){if(/^https?:\/\//i.test(l)&&m.name&&!seen.has(l)){seen.add(l);out.push(toRadio(m,l,out.length,country,pre))}m=null}}
  return out}

let radios=null,demo=false,favs=store.get("ril-fav",[]),dead=new Set(),cur=null,status="idle",err="";
/* Lettura flessibile: M3U, JSON (lista di oggetti) oppure righe di testo/markdown con "Nome, URL" */
function parseAny(t,country,pre){
  if(t.includes("#EXTINF"))return parseM3U(t,country,pre);
  let items=[];
  try{let j=JSON.parse(t);if(!Array.isArray(j))j=Object.values(j).find(Array.isArray)||[];
    items=j.map(o=>({name:o.name||o.title||o.station||o.nome,url:o.url_resolved||o.streamUrl||o.stream_url||o.stream||o.url||o.src||o.link,logo:o.logo||o.favicon||o.image||o.icon||"",group:[o.region,o.regione,o.city,o.citta,o.state,o.genre,o.tags,o.group].flat().filter(Boolean).join(" "),lang:o.language||o.lingua||""}))}
  catch{items=t.split(/\r?\n/).map(l=>{const md=l.match(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/);if(md)return{name:md[1],url:md[2],logo:"",group:"",lang:""};
      const m=l.match(/https?:\/\/[^\s,;|"'<>]+/);if(!m)return null;const trim=x=>x.replace(/^[\s,;|\-–:=]+|[\s,;|\-–:=]+$/g,"");
      return{name:trim(l.slice(0,m.index))||trim(l.slice(m.index+m[0].length))||new URL(m[0]).hostname,url:m[0],logo:"",group:"",lang:""}}).filter(Boolean)}
  return fromItems(items,country,pre)}
function fromItems(items,country,pre){const seen=new Set(),out=[];
  for(const o of items)if(o&&o.name&&/^https?:\/\//i.test(o.url||"")&&!seen.has(o.url)){seen.add(o.url);
    const r=toRadio({name:String(o.name).trim(),logo:o.logo,group:o.group,lang:o.lang,lat:o.lat,lon:o.lon},o.url,out.length,country,pre);r.clicks=o.clicks||0;if(o.id)r.id=pre+o.id;out.push(r)}
  return out}
const RB=["https://de1.api.radio-browser.info","https://de2.api.radio-browser.info","https://nl1.api.radio-browser.info"];
async function rbItems(){const key="ril-rb",c=store.get(key,null);   // cache 12 ore
  if(c&&Date.now()-c.t<12*3600e3)return c.list;
  for(const b of RB){try{const r=await fetch(b+"/json/stations/search?countrycode=IT&hidebroken=true&order=clickcount&reverse=true&limit=4000");if(!r.ok)continue;
    const list=(await r.json()).map(o=>({id:o.stationuuid,name:(o.name||"").trim(),url:o.url_resolved||o.url,logo:o.favicon||"",group:(o.state||"")+" "+(o.tags||""),lang:/ital/i.test(o.language||"")?"Italiano":(o.language||""),lat:o.geo_lat,lon:o.geo_long,clicks:o.clickcount||0}));
    if(list.length){store.set(key,{t:Date.now(),list});return list}}catch{}}
  if(c)return c.list;throw 0}
async function gistTexts(id){const key="ril-gist-"+id,c=store.get(key,null);   // cache 6 ore (l'API GitHub ha un limite di richieste)
  if(c&&Date.now()-c.t<6*3600e3)return c.texts;
  try{const g=await(await fetch("https://api.github.com/gists/"+id)).json();
    const texts=await Promise.all(Object.values(g.files||{}).map(async f=>f.truncated?await(await fetch(f.raw_url)).text():f.content));
    if(!texts.length)throw 0;store.set(key,{t:Date.now(),texts});return texts}
  catch{if(c)return c.texts;throw 0}}
async function load(){
  const res=await Promise.allSettled(SOURCES.map(async(src,k)=>{const pre=src.p;
    if(src.rb)return fromItems(await rbItems(),src.country,pre);
    if(src.gist)return(await gistTexts(src.gist)).flatMap((t,j)=>parseAny(t,src.country,pre+j+"-"));
    const r=await fetch(src.url);if(!r.ok)throw 0;return parseM3U(await r.text(),src.country,pre)}));
  const seen=new Set(),all=[];
  res.forEach(x=>{if(x.status==="fulfilled")x.value.forEach(r=>{if(!seen.has(r.streamUrl)){seen.add(r.streamUrl);all.push(r)}})});
  if(!all.length){radios=MOCK;demo=true}else{const top=new Set(all.filter(r=>r.clicks>0).sort((a,b)=>b.clicks-a.clicks).slice(0,40).map(r=>r.id));let n=0;
    radios=all.map(r=>({...r,isFeatured:top.size?top.has(r.id):r.isNational&&n++<40}))}
  route()}

/* ============ Player (una sola istanza Audio: continua durante la navigazione) ============ */
const A=new Audio();A.preload="none";let hls=null,timer,tok=0,att=0;
const loadHls=()=>window.Hls?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
function setS(s,e=""){status=s;err=e;sync()}
function fail(r,msg){clearTimeout(timer);dead.add(r.id);setS("error",msg)}
function retry(r,a,t){if(t!==tok)return;if(a>=2){A.pause();return fail(r,"Questa radio non risponde: probabilmente è offline.")}setS("loading");setTimeout(()=>{if(t===tok)start(r,a+1)},800)}
async function start(r,a=0){const t=++tok;att=a;cur=r;clearTimeout(timer);if(hls){hls.destroy();hls=null}A.pause();let u=r.streamUrl;
  if(!u)return fail(r,"Stream non configurato: radio di esempio (demo).");
  if(location.protocol==="https:"&&u.startsWith("http:"))return fail(r,"Stream http bloccato dal browser su pagine https.");
  setS("loading");timer=setTimeout(()=>retry(r,a,t),15000);
  try{if(/\.(pls|m3u)(\?|$)/i.test(u)){const m=(await(await fetch(u)).text()).match(/^(?:File\d+=)?(https?:\/\/\S+)$/m);if(!m)throw 0;u=m[1]}
    if(t!==tok)return;
    if(/\.m3u8(\?|$)/i.test(u)&&!A.canPlayType("application/vnd.apple.mpegurl")){await loadHls();if(t!==tok)return;if(!Hls.isSupported())throw 0;hls=new Hls();hls.loadSource(u);hls.attachMedia(A);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)retry(r,a,t)})}else A.src=u;
    await A.play()}catch{if(t===tok)retry(r,a,t)}}
function toggle(){if(!cur)return;if(status==="playing"||status==="loading"){tok++;clearTimeout(timer);A.pause();setS("paused")}else start(cur)}
A.onplaying=()=>{clearTimeout(timer);dead.delete(cur.id);setS("playing")};
A.onpause=()=>{if(status!=="loading"&&status!=="error")setS("paused")};
const stall=()=>{if(!cur||A.paused)return;setS("loading");clearTimeout(timer);const t=tok,r=cur;timer=setTimeout(()=>retry(r,0,t),10000)};
A.onwaiting=stall;A.onstalled=stall;A.onerror=()=>{if(cur)retry(cur,att,tok)};
A.volume=store.get("ril-vol",.8);
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];store.set("ril-fav",favs);if(location.hash.startsWith("#/preferiti"))route();else sync()}

/* ============ UI: card e sincronizzazione ============ */
const ico=on=>on&&status==="loading"?'<span class="sp"></span>':on&&status==="playing"?"❚❚":"▶";
const logo=r=>`<div class="logo" style="background:linear-gradient(135deg,hsl(${hue(r.name)} 80% 58%),hsl(${(hue(r.name)+60)%360} 80% 48%))">${esc(r.name[0])}${r.logo?`<img src="${esc(r.logo)}" alt="Logo ${esc(r.name)}" loading="lazy" onerror="this.remove()">`:""}</div>`;
const card=r=>`<article class="card glass" data-id="${esc(r.id)}"><div class="row">${logo(r)}<div class="grow"><h3>${esc(r.name)}</h3><p class="mut">${esc(r.city||r.region)}${r.isNational&&r.country==="Italia"?" · Nazionale":""}</p></div>
<span class="live"><i></i>LIVE</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="offl">Offline</span></div>
<div class="row between"><div>${r.genre.slice(0,2).map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div><div class="row" style="gap:2px"><button class="fav" data-fav="${esc(r.id)}" aria-label="Preferiti ${esc(r.name)}">♥</button><button class="play" data-play="${esc(r.id)}" aria-label="Ascolta ${esc(r.name)}">▶</button></div></div></article>`;
function sync(){
  document.querySelectorAll(".card").forEach(c=>{const id=c.dataset.id,on=cur&&cur.id===id;
    c.classList.toggle("active",!!on);c.classList.toggle("off",dead.has(id));c.classList.toggle("playing",!!on&&status==="playing");
    $(".play",c).innerHTML=ico(on);$(".play",c).setAttribute("aria-label",(on&&status==="playing"?"Pausa ":"Ascolta ")+(radios.find(r=>r.id===id)||{}).name);$(".fav",c).classList.toggle("on",favs.includes(id))});
  const p=$("#player");if(!cur){p.hidden=true;return}p.hidden=false;
  $("#plogo").outerHTML=logo(cur).replace('class="logo"','class="logo" id="plogo"');
  $("#pn").textContent=cur.name;const s=$("#ps");s.className=status==="error"?"e":"";
  s.textContent=status==="error"?err:status==="loading"?"Connessione...":(cur.city||cur.region)+" · LIVE";
  $("#peq").classList.toggle("on",status==="playing");$("#pplay").innerHTML=ico(true);$("#pplay").setAttribute("aria-label",status==="playing"?"Pausa":"Play");
  $("#pfav").classList.toggle("on",favs.includes(cur.id));$("#mute").textContent=A.muted||A.volume===0?"🔇":"🔊"}

/* ============ Lista con filtri e ricerca live ============ */
function browser(host,{fixed={},q="",filters=true}={}){
  const F={q,country:"",region:"",city:"",genre:"",scope:"",lang:"",sort:"az",n:60,...fixed};
  const opt=(a,l)=>`<option value="">${l}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join("");
  const sg=uniq([...REGIONS,...GENRES,...radios.map(r=>r.city),...radios.slice(0,150).map(r=>r.name)]);
  host.innerHTML=(filters?`<div class="bar-f"><div class="sw"><input id="fq" list="sg" placeholder="Cerca una radio, una città o un genere..." aria-label="Cerca" value="${esc(q)}"><button id="fclr" aria-label="Cancella ricerca" ${q?"":"hidden"}>✕</button><datalist id="sg">${sg.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
    ${fixed.region?"":`<select id="fregion" aria-label="Regione">${opt(REGIONS,"Tutte le regioni")}</select>`}${fixed.country||new Set(radios.map(r=>r.country)).size<2?"":`<select id="fcountry" aria-label="Paese">${opt(uniq(radios.map(r=>r.country)),"Tutti i paesi")}</select>`}<select id="fcity" aria-label="Città"></select><select id="fgenre" aria-label="Genere">${opt(uniq([...GENRES,...radios.flatMap(r=>r.genre)]),"Tutti i generi")}</select>
    <select id="fscope" aria-label="Tipo"><option value="">Nazionali e locali</option><option value="n">Nazionali</option><option value="l">Locali</option></select><select id="flang" aria-label="Lingua">${opt(uniq(radios.map(r=>r.language)),"Tutte le lingue")}</select>
    <select id="fsort" aria-label="Ordinamento"><option value="az">A-Z</option><option value="pop">Più ascoltate</option><option value="feat">In evidenza</option><option value="new">Aggiunte di recente</option></select></div>`:"")+`<p id="cnt" class="mut" aria-live="polite"></p><div id="lst" class="grid"></div><button id="more" class="more" hidden>Mostra altre</button>`;
  const cities=()=>{const el=$("#fcity");if(el)el.innerHTML=opt(uniq(radios.filter(r=>!F.region||r.region===F.region).map(r=>r.city)),"Tutte le città")};
  const draw=()=>{const s=F.q.trim().toLowerCase();
    let l=radios.filter(r=>(!F.country||r.country===F.country)&&(!F.region||r.region===F.region||(F.nat&&r.isFeatured))&&(!F.city||r.city===F.city)&&(!F.genre||r.genre.includes(F.genre))&&(!F.scope||(F.scope==="n")===r.isNational)&&(!F.lang||r.language===F.lang)&&(!s||[r.name,r.region,r.city||"",...r.genre].some(x=>x.toLowerCase().includes(s))));
    l=F.sort==="az"?[...l].sort((a,b)=>a.name.localeCompare(b.name)):F.sort==="pop"?[...l].sort((a,b)=>(b.clicks||0)-(a.clicks||0)):F.sort==="feat"?[...l].sort((a,b)=>+!!b.isFeatured-+!!a.isFeatured):[...l].reverse();
    $("#cnt").textContent=l.length+" radio";$("#lst").innerHTML=l.slice(0,F.n).map(card).join("")||"";
    if(!l.length)$("#lst").innerHTML='<div class="empty" style="grid-column:1/-1">Nessun risultato.</div>';
    $("#more").hidden=F.n>=l.length;const c=$("#fclr");if(c)c.hidden=!F.q;sync()};
  const key={fcountry:"country",fq:"q",fregion:"region",fcity:"city",fgenre:"genre",fscope:"scope",flang:"lang",fsort:"sort"};
  host.oninput=host.onchange=e=>{const k=key[e.target.id];if(!k)return;F[k]=e.target.value;F.n=60;if(k==="region"){F.city="";cities()}draw()};
  host.onclick=e=>{if(e.target.id==="more"){F.n+=60;draw()}if(e.target.id==="fclr"){F.q="";$("#fq").value="";draw()}};
  cities();if(fixed.genre&&$("#fgenre"))$("#fgenre").value=fixed.genre;draw()}

/* ============ Pagine e routing (hash: #/radio, #/regioni/lazio, ...) ============ */
const app=$("#app");
const page={
  home(){app.innerHTML=`<section class="hero"><span class="pill glass"><span class="live"><i></i></span>In diretta, 24 ore su 24</span><h1 class="grad">Tutta la radio italiana.<br>In un unico posto.</h1><p class="mut">Scopri e ascolta centinaia di radio italiane in streaming, ovunque tu sia.</p>
    <form class="sf" role="search" id="hf"><input id="hq" placeholder="Cerca una radio, una città o un genere..." aria-label="Cerca"><button class="btn">Cerca</button></form><div class="wf" aria-hidden="true">${Array.from({length:36},(_,i)=>`<i style="animation-delay:${(i%9)*.11}s"></i>`).join("")}</div></section>
    <h2>🔥 Radio più ascoltate</h2><div class="grid">${radios.filter(r=>r.isFeatured).slice(0,12).map(card).join("")}</div>`;
    $("#hf").onsubmit=e=>{e.preventDefault();location.hash="#/cerca?q="+encodeURIComponent($("#hq").value)};sync()},
  radio(){app.innerHTML='<h1>Tutte le Radio</h1><div id="b"></div>';browser($("#b"))},
  cerca(q){app.innerHTML='<h1>Cerca</h1><div id="b"></div>';browser($("#b"),{q})},
  regioni(){const NAT=radios.filter(x=>x.isFeatured).length;app.innerHTML=`<h1>Regioni</h1><div class="grid rg">${REGIONS.map(r=>`<a class="rc" style="--h:${hue(r)}" href="#/regioni/${slug(r)}"><em>${r[0]}</em><b>${r}</b><span>${radios.filter(x=>x.region===r).length} locali + ${NAT} nazionali</span></a>`).join("")}</div>`},
  regione(s){const r=REGIONS.find(x=>slug(x)===s);if(!r){app.innerHTML='<div class="empty">Regione non trovata.</div>';return}app.innerHTML=`<h1>Radio in ${esc(r)}</h1><p class="mut" style="margin:-12px 0 20px">Radio locali della regione + radio nazionali, ascoltabili da ogni regione.</p><div id="b"></div>`;browser($("#b"),{fixed:{region:r,nat:true,country:"Italia"}})},
  generi(s){const ALL=["Tutte",...GENRES,"Varie"];const g=ALL.find(x=>slug(x)===s)||"Tutte";
    app.innerHTML=`<h1>Generi</h1><div class="gg">${ALL.map(x=>`<a class="gc ${x===g?"sel":""}" style="--h:${hue(x)}" href="#/generi/${slug(x)}"><big>${EMO[x]}</big><b>${x}</b><small>${radios.filter(r=>x==="Tutte"||r.genre.includes(x)).length} radio</small></a>`).join("")}</div><div id="b"></div>`;
    browser($("#b"),{fixed:{genre:g==="Tutte"?"":g},filters:false})},
  preferiti(){const l=radios.filter(r=>favs.includes(r.id));app.innerHTML="<h1>Le mie radio preferite</h1>"+(l.length?`<div class="grid">${l.map(card).join("")}</div>`:'<div class="empty">💜<br>Nessun preferito ancora.<br>Tocca il cuore su una radio per salvarla.</div>');sync()}};
function route(){const [path,qs]=(location.hash.slice(1)||"/").split("?"),seg=path.split("/").filter(Boolean);
  document.querySelectorAll("nav ul a").forEach(a=>a.classList.toggle("act",a.getAttribute("href")==="#/"+(seg[0]||"")));
  $("#nav").classList.remove("open");window.scrollTo(0,0);
  if(!radios){app.innerHTML='<div class="grid">'+'<div class="sk"></div>'.repeat(6)+"</div>";return}
  const p=seg[0]||"home";(page[p]||page.home)(p==="cerca"?new URLSearchParams(qs||"").get("q")||"":seg[1]);
  if(demo)app.insertAdjacentHTML("afterbegin",'<p class="empty" style="padding:0 0 18px">⚠️ Playlist non raggiungibile (serve internet): mostro un elenco di esempio senza stream.</p>')}
addEventListener("hashchange",route);

/* ============ Eventi globali ============ */
document.addEventListener("click",e=>{const p=e.target.closest("[data-play]"),f=e.target.closest("[data-fav]");
  if(p){const r=radios.find(x=>x.id===p.dataset.play);cur&&cur.id===r.id?toggle():start(r)}
  if(f)toggleFav(f.dataset.fav)});
$("#pplay").onclick=toggle;$("#pfav").onclick=()=>cur&&toggleFav(cur.id);
$("#mute").onclick=()=>{A.muted=!A.muted;sync()};
$("#vol").value=A.volume;$("#vol").oninput=e=>{A.volume=+e.target.value;A.muted=false;store.set("ril-vol",A.volume);sync()};
$("#pname").onclick=()=>$("#player").classList.toggle("open");
$("#share").onclick=()=>{if(!cur)return;navigator.share?navigator.share({title:cur.name,url:location.href}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(cur.name+" - "+location.href)};
$("#menu").onclick=()=>{const n=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",n)};
const setTheme=l=>{document.documentElement.classList.toggle("light",l);$("#theme").textContent=l?"🌙":"☀️";store.set("ril-theme",l?"light":"dark")};
$("#theme").onclick=()=>setTheme(!document.documentElement.classList.contains("light"));
setTheme(store.get("ril-theme","dark")==="light");
route();load();
</script>
